<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<div th:fragment="side_bar" class="side_bar">
  <div class="side_header">
      <a class="username" th:href="@{/users/{userId}/edit(userId=${user.id})}" th:text="${user.name}" >ユーザー名</a>
      <a th:href="@{/rooms/new}" class="create_chat">チャットを作成する</a>
  </div>
  <div class="side_title">
    <div th:each="room : ${rooms}"  class="room">
      <div class="chatroom">
        <a th:href="@{/rooms/{roomId}/messages(roomId=${room.id})}" th:text="${room.name}">techroom</a>
      </div>
    </div>
  </div>
</div>
</html>
