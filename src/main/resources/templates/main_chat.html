<div th:fragment="main_chat" class="main_chat">
  <div class="main_header">
    <p class="current_chat" th:text="${room.name}">ルーム名</p>
    <div class="end_chat">
        <form th:action="@{/rooms/{roomId}/delete(roomId=${room.id})}" method="post">
          <input type="submit" value="チャットを終了する"/>
        </form>
    </div>
  </div>
  <div class="main_main">
      <div th:each="message: ${messages}"  class="main_post">
        <div class="main_flex">
          <div class="message-user" th:text="${message.user.name}">ユーザー名</div>
          <div class="time_post" th:text="${#dates.format(message.createdAt, 'yyyy/MM/dd HH:mm:ss')}">日付</div>
        </div>
        <div class="post_content" th:text="${message.content}">メッセージ内容</div>
      <div th:if="${message.image}">
        <img th:src="@{${message.image}}" alt="メッセージ画像" style="width: 500px; height: 500px;"/>
      </div>
      </div>
  </div>
  <div class="main_footer">
 <form th:action="@{/rooms/{roomId}/messages(roomId=${room.id})}" method="post" th:object="${messageForm}" class="form" enctype="multipart/form-data">
      <div class="form_input">
        <input th:field="*{content}" class="enter_content" placeholder= "type a message"/>
        <label class="form_image">
          <span class="image-file">画像</span>
          <input type="file" th:field="*{image}" class="hidden">
        </label>
      </div>
      <input class="bt_post" type="submit" value="送信"/>
    </form>
  </div>
</div>
